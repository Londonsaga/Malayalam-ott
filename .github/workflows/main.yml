name: Scrape Malayalam OTT Releases

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape and save data.json
        run: python scraper.py

      - name: Copy files to root for GitHub Pages
        run: |
          cp public/index.html index.html
          cp public/data.json data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json public/data.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update Malayalam OTT data $(date +'%Y-%m-%d')"
          git push origin HEAD:main --force
